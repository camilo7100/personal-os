name: CI

on:
  push: {branches: [main]}
  pull_request:

jobs:
  test:
    runs-on: windows-latest   # el sistema usa el Administrador de credenciales y el Programador de tareas de Windows
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Pruebas
        run: python -m pytest -q scripts/tests
